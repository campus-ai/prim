name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          - os: macos-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install

      - run: pnpm contracts:check

      - name: Verify canonical contract provenance
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        shell: bash
        env:
          PRIMITIVE_CONTRACT_READ_TOKEN: ${{ secrets.PRIMITIVE_CONTRACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIMITIVE_CONTRACT_READ_TOKEN:-}" ]]; then
            echo "PRIMITIVE_CONTRACT_READ_TOKEN is required for canonical contract provenance" >&2
            exit 1
          fi
          basic_auth="$(printf 'x-access-token:%s' "$PRIMITIVE_CONTRACT_READ_TOKEN" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "$basic_auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/campus-ai/primitive.git.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic_auth"
          export GIT_TERMINAL_PROMPT=0
          pnpm contracts:provenance

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Exercise launchd convergence
        if: matrix.os == 'macos-latest'
        run: pnpm vitest run src/daemon/launchd.integration.spec.ts
        env:
          PRIM_LAUNCHD_INTEGRATION: "1"
