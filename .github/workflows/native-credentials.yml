name: Native credential storage
on:
  pull_request:
  workflow_dispatch:
jobs:
  persistent-storage:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Test Linux persistent Secret Service
        if: runner.os == 'Linux'
        shell: bash
        env:
          PRIM_NATIVE_KEYRING_INTEGRATION: '1'
        run: |
          dbus-run-session -- bash -c 'eval "$(printf "fixture-password" | gnome-keyring-daemon --unlock --components=secrets)"; pnpm exec vitest run src/lib/native-keyring.integration.spec.ts src/lib/machine-credentials.spec.ts'
      - name: Test platform credential store and copied binary
        if: runner.os != 'Linux'
        env:
          PRIM_NATIVE_KEYRING_INTEGRATION: '1'
        run: pnpm exec vitest run src/lib/native-keyring.integration.spec.ts src/lib/machine-credentials.spec.ts
