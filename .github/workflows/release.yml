name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      npm_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      npm_tag:
        description: npm distribution tag for this publish
        required: true
        default: alpha
        type: choice
        options: [alpha, latest]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Verify manually selected release
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$(gh release view "$TAG_NAME" --json tagName --jq .tagName)" = "$TAG_NAME"
          test "v$(node -p "require('./package.json').version")" = "$TAG_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pin npm to 11.18.0. npm 12.0.0 stopped hoisting the bundled
      # `sigstore` module to a path the global libnpmpublish can resolve, so
      # `npm publish --provenance` dies with "Cannot find module 'sigstore'".
      # 11.18.0 is the newest 11.x (hoists sigstore correctly) and still
      # clears the >= 11.5.1 floor OIDC trusted publishing needs. `@latest`
      # rode straight into the broken 12.0.0. Revisit once npm ships a fixed 12.x.
      - run: npm install -g npm@11.18.0
      - run: pnpm install
      - run: pnpm build

      - name: Determine npm tag
        id: npm-tag
        run: |
          case "$REQUESTED_NPM_TAG" in
            alpha|latest) tag="$REQUESTED_NPM_TAG" ;;
            '')
              if [[ "$RELEASE_TAG" == *alpha* ]]; then
                tag=alpha
              else
                tag=latest
              fi
              ;;
            *) echo "Unsupported npm tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          REQUESTED_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_TAG: ${{ inputs.tag_name }}

      - run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public --provenance
