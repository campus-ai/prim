name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pin npm to 11.18.0. npm 12.0.0 stopped hoisting the bundled
      # `sigstore` module to a path the global libnpmpublish can resolve, so
      # `npm publish --provenance` dies with "Cannot find module 'sigstore'".
      # 11.18.0 is the newest 11.x (hoists sigstore correctly) and still
      # clears the >= 11.5.1 floor OIDC trusted publishing needs. `@latest`
      # rode straight into the broken 12.0.0. Revisit once npm ships a fixed 12.x.
      - run: npm install -g npm@11.18.0
      - run: pnpm install
      - run: pnpm build

      - name: Determine npm tag
        id: npm-tag
        run: |
          if echo "${{ inputs.tag_name }}" | grep -q "alpha"; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public --provenance
