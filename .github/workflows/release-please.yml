name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      npm_tag:
        description: npm distribution tag for this publish
        required: true
        default: alpha
        type: choice
        options: [alpha, latest]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}

  publish:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
      # Publish the reviewed bypass-enforcement release to the onboarding channel.
      # Later prereleases keep their existing alpha default.
      npm_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || needs.release-please.outputs.tag_name == 'v0.1.0-alpha.113' && 'latest' || '' }}
    permissions:
      contents: read
      id-token: write
