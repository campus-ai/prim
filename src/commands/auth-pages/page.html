<!doctype html>
<!--
  The OAuth callback page — one template for the success page and both failure
  variants. This tab gets ~3 seconds of a human's attention before they close
  it, so it's a small, on-brand easter egg rather than a bare h1: the message
  sits on the homepage's framed canvas (the inset rounded hero, as a hairline)
  with a mono eyebrow in the brand orange — the system mono face standing in
  for the brand's Berkeley Mono — and the Primitive lockup resting underneath.

  Fully self-contained: inline CSS, system fonts, inline logo SVG, and a
  favicon inlined from the sibling SVG asset — it's served off a throwaway
  localhost server with no static assets, so the page makes zero external
  requests.

  The document title, favicon, eyebrow, headline, and detail slots are filled
  by index.ts exclusively from module-local string constants; nothing request-
  or provider-derived is ever interpolated into this template. (fill() expands
  placeholders even inside comments, so none appear literally here.)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{DOC_TITLE}}</title>
    <link rel="icon" type="image/svg+xml" href="{{FAVICON_HREF}}" />
    <style>
      :root {
        --inter-orange: #ff4f00;
        --light-bg: #f5f5f5;
        --black: #333333;
        --hairline: rgba(0, 0, 0, 0.16);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background-color: var(--light-bg);
        color: var(--black);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.5;
        overflow: hidden;
      }
      /* The brand frame: the homepage's inset rounded hero canvas, as a hairline. */
      .frame {
        position: fixed;
        inset: 16px;
        border: 1px solid var(--hairline);
        border-radius: 24px;
        pointer-events: none;
        z-index: 1;
      }
      .card { position: relative; z-index: 2; width: 100%; max-width: 460px; text-align: center; }

      .eyebrow {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--inter-orange);
      }
      .title {
        font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;
        margin: 14px 0 10px;
      }
      .subtitle {
        font-size: 15px; color: rgba(0, 0, 0, 0.55);
      }
      .mark { margin-top: 40px; }
      .mark svg { height: 22px; width: auto; color: rgba(0, 0, 0, 0.38); }

      @media (max-width: 460px) {
        .title { font-size: 26px; }
        .frame { inset: 10px; border-radius: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-hidden="true"></div>
    <main class="card">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1 class="title">{{TITLE}}</h1>
      <p class="subtitle">{{DETAIL}}</p>
